<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"><title>Aieyra 浏览器</title><link rel="stylesheet" href="../../../Program/official/browser/ui/browser-shell.css"></head>
<body>
<div id="chrome">
 <header id="browser-titlebar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c5 5 5 11 0 16-5-5-5-11 0-16"/></svg><span>浏览器</span></header>
 <nav aria-label="浏览器导航">
  <div class="nav-actions"><button id="back" class="icon-button" aria-label="返回"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button><button id="forward" class="icon-button" aria-label="前进"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6M16 12H4"/></svg></button><button id="reload" class="icon-button" aria-label="刷新"><svg viewBox="0 0 20 20"><path d="M15 7a6 6 0 1 0 1 6M15 3v5h-5"/></svg></button></div>
  <form id="navigate"><span id="site-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c5 5 5 11 0 16-5-5-5-11 0-16"/></svg></span><input id="address" aria-label="网址" spellcheck="false" autocomplete="off" placeholder="搜索或输入网址"><button id="bookmark" class="icon-button" type="button" aria-label="收藏此页" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg></button></form>
  <div class="nav-utilities"><button id="download-history" class="icon-button" aria-label="下载记录" title="下载记录 · Ctrl+J"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg></button><button id="profile-button" class="icon-button avatar-button" aria-label="浏览身份" title="浏览身份"><span id="profile">A</span></button><button id="control-button" type="button" hidden>交给 Eyra</button><button id="placement" class="icon-button" type="button" aria-label="独立窗口" title="独立窗口" hidden><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M11 8h5v5m0-5-8 8"/></svg></button><button id="browser-menu" class="icon-button" aria-label="浏览器菜单" title="浏览器菜单"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="19" cy="12" r=".8"/></svg></button></div>
 </nav>
 <div id="bookmarks" aria-label="收藏夹" hidden></div>
 <div id="find-bar" hidden><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="find-query" aria-label="在页面中查找" autocomplete="off" placeholder="在此页面查找"><span id="find-count" role="status"></span><button id="find-previous" class="icon-button" aria-label="上一个结果"><svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg></button><button id="find-next" class="icon-button" aria-label="下一个结果"><svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg></button><button id="find-close" class="icon-button" aria-label="关闭查找"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div id="notice" role="status" hidden></div><div id="loading-track" aria-hidden="true"></div>
</div>
<main id="start-page" hidden><form id="start-search" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="start-query" aria-label="搜索或输入网址" autocomplete="off" placeholder="百度搜索或输入网址"><button type="submit" class="icon-button" aria-label="前往"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></form></main>
<div id="page-placeholder" hidden><svg viewBox="0 0 24 24"><path d="M12 8v5m0 3v.1"/><circle cx="12" cy="12" r="9"/></svg><h2>暂时无法显示此页面</h2><p>可以刷新重试，或在地址栏打开另一个网址。</p><button id="retry-page" class="primary">重新加载</button></div>
<img id="panel-backdrop" alt="" aria-hidden="true" hidden><aside id="browser-panel" aria-labelledby="panel-title" hidden><div class="panel-heading"><h2 id="panel-title"></h2><button id="panel-close" class="icon-button" aria-label="关闭侧栏"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="panel-content"></div></aside>
<div id="browser-bottom"><div class="tab-row"><div id="tabs" role="tablist" aria-label="标签页"></div><button id="new-tab" class="icon-button" type="button" aria-label="新标签页" title="新标签页 · Ctrl+T"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
<footer id="downloads" aria-live="polite" hidden></footer>
<div id="dialog" class="scrim" hidden><section role="dialog" aria-modal="true" aria-labelledby="dialog-title"><span class="dialog-mark" aria-hidden="true">i</span><h1 id="dialog-title">网站提示</h1><p id="dialog-message"></p><input id="dialog-input" hidden aria-label="输入内容"><div class="actions"><button id="dialog-cancel">取消</button><button id="dialog-accept" class="primary">确定</button></div></section></div>
<script src="../../../Program/official/browser/ui/browser-navigation.js"></script><script src="../../../Program/official/browser/ui/browser-panels.js"></script><script src="../../../Program/official/browser/ui/browser-shell.js"></script><script type="module" src="tips.mjs"></script></body></html>
