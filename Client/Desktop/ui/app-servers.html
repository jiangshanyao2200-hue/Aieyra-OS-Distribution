<!-- Compatibility document for already running hosts; canonical UI: Program/official/servers/ui. -->
<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: aieyra-theme:; font-src 'self' aieyra-theme:">
<title>服务器</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="app-shell.css"><link rel="stylesheet" href="image-crop.css"><link rel="stylesheet" href="vendor/xterm.css"><link rel="stylesheet" href="../../../Program/official/servers/ui/app-servers.css"></head>
<body>
<nav class="app-rail" id="rail" aria-label="服务器"></nav>
<main class="app-main">
 <section id="v-list" aria-label="服务器">
  <div id="rows" class="sv-rows"></div>
  <p id="empty" class="sv-empty" hidden>还没有服务器</p>
  <button id="ask-add" class="sv-add" type="button"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i><span>让 Eyra 添加服务器</span></button>
 </section>
 <section id="v-detail" aria-label="服务器详情" hidden>
  <header class="sv-hero">
   <span id="d-cover" class="sv-cover"></span>
   <div class="sv-identity">
    <h1 id="d-name"></h1>
    <p id="d-os"></p>
    <p class="sv-address"><span id="d-address">地址已隐藏</span><button id="d-reveal" class="sv-link" type="button">查看 IP</button></p>
   </div>
   <div id="d-actions" class="sv-actions"></div>
  </header>
  <p id="d-error" class="sv-error" role="status" hidden></p>
  <div id="d-tiles" class="sv-tiles"></div>
  <div class="sv-columns">
   <section><h2>硬盘</h2><div id="d-disks" class="sv-lines"></div></section>
   <section><h2>进程</h2><div id="d-procs" class="sv-lines"></div></section>
   <section><h2>容器</h2><div id="d-boxes" class="sv-lines"></div></section>
  </div>
  <section class="sv-terminal" id="terminal" hidden><header><span id="t-title">终端</span><button id="t-close" class="pill" type="button">关闭</button></header><div id="t-screen"></div></section>
 </section>
 <section id="v-manage" aria-label="管理" hidden>
  <div id="m-rows" class="sv-manage-rows"></div>
  <p id="m-empty" class="sv-empty" hidden>还没有服务器</p>
 </section>
 <section id="v-vault" aria-label="密码本" hidden>
  <div id="vault-rows" class="sv-vault-rows"></div>
  <p id="vault-empty" class="sv-empty" hidden>密码本是空的</p>
  <button id="vault-new" class="sv-add" type="button"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i><span>记一条</span></button>
 </section>
</main>
<dialog id="vault-dialog" class="sv-dialog" aria-labelledby="vault-heading">
 <form id="vault-form" method="dialog">
  <h2 id="vault-heading">记一条</h2>
  <label>标题<input class="field" id="v-title" maxlength="80" required autocomplete="off"></label>
  <label>账号<input class="field" id="v-account" maxlength="200" autocomplete="off" spellcheck="false"></label>
  <label>地址<input class="field" id="v-url" maxlength="500" autocomplete="off" spellcheck="false"></label>
  <label>密码<span class="sv-secret-field"><input class="field" id="v-secret" type="password" maxlength="4000" autocomplete="new-password" spellcheck="false"><button id="v-show" class="sv-link" type="button">显示</button></span></label>
  <label>备注<textarea class="field" id="v-note" maxlength="8000" rows="3"></textarea></label>
  <div class="sv-switch-row"><span>允许 Agent 读取</span><button id="v-agent" class="sv-switch" type="button" role="switch" aria-checked="false" aria-label="允许 Agent 读取"><i></i></button></div>
  <footer><span id="v-status" role="status"></span><button class="pill" type="button" id="v-cancel">取消</button><button class="pill primary" type="submit" id="v-save">保存</button></footer>
 </form>
</dialog>
<div id="app-notice" class="app-notice" role="status" hidden></div>
<script type="module" src="../../../Program/official/servers/ui/app-servers.mjs"></script>
</body></html>
