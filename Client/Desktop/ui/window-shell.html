<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: aieyra-theme:; font-src 'self' aieyra-theme:; base-uri 'none'; form-action 'none'">
<title>Aieyra</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="module-shell.css"><link rel="stylesheet" href="appearance.css">
<style>body{height:100vh;margin:0;overflow:hidden;background:#08090b;color:#e6e9f0}.shell-bar{display:flex;align-items:center;height:40px;padding:0 6px 0 16px;app-region:drag;font:500 12.5px/1 "Aieyra Inter","Aieyra Noto Sans SC",sans-serif;color:#9aa3b2}.shell-bar strong{flex:1 1 auto;overflow:hidden;font-weight:500;text-overflow:ellipsis;white-space:nowrap}.shell-bar nav{display:flex;gap:2px;app-region:no-drag}.shell-bar button{display:grid;place-items:center;width:34px;height:28px;padding:0;border:0;border-radius:8px;background:transparent;color:#9aa3b2;transition:background-color 160ms cubic-bezier(.2,.8,.2,1),color 160ms cubic-bezier(.2,.8,.2,1)}.shell-bar button:hover{background:#ffffff14;color:#e6e9f0}.shell-bar #close:hover{background:#c42b1c;color:#fff}.shell-bar svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.2}</style></head>
<body><header class="shell-bar"><strong id="title"></strong><nav aria-label="窗口"><button id="minimize" type="button" aria-label="最小化"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg></button><button id="maximize" type="button" aria-label="最大化"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg></button><button id="close" type="button" aria-label="关闭"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></nav></header>
<script type="module" src="window-shell.mjs"></script></body></html>
