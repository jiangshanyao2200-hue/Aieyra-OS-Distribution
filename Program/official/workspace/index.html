<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" type="image/png" href="./aieyra-workspace.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' aieyra-module:; style-src 'self' 'unsafe-inline' aieyra-module:; connect-src 'self' blob: http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data: blob: iiimage-asset: https:; media-src 'self' blob: iiimage-asset:; font-src 'self' data:;"
    />
    <title>Aieyra Workspace</title>
    <style>
      :root {
        color-scheme: light;
        --boot-bg: #f3f3f3;
        --boot-card: #ffffff;
        --boot-ink: #1f1f1f;
        --boot-muted: #666666;
        --boot-line: #d6d6d6;
        --boot-accent: #007acc;
        --boot-accent-soft: #e8f2fb;
        --boot-shadow: 0 12px 34px rgba(0, 0, 0, 0.12);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --boot-bg: #0e1513;
          --boot-card: #18211f;
          --boot-ink: #edf6f2;
          --boot-muted: #a7b8b2;
          --boot-line: rgba(236, 246, 241, 0.13);
          --boot-accent: #72eee2;
          --boot-accent-soft: #202b28;
          --boot-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
        }
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--boot-bg);
      }

      #root {
        min-height: 100vh;
      }

      .boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--boot-ink);
        background: var(--boot-bg);
      }

      .boot-shell-card {
        width: min(380px, calc(100vw - 48px));
        display: grid;
        gap: 12px;
        padding: 18px;
        border: 1px solid var(--boot-line);
        border-radius: 8px;
        background: var(--boot-card);
        box-shadow: var(--boot-shadow);
      }

      .boot-shell-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid var(--boot-line);
        border-radius: 8px;
        color: var(--boot-accent);
      }

      .boot-shell h1 {
        margin: 0;
        font-size: 19px;
        line-height: 1.18;
      }

      .boot-shell p {
        margin: 0;
        color: var(--boot-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .boot-shell-line {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        border: 1px solid var(--boot-line);
        border-radius: 8px;
        color: var(--boot-accent);
        background: var(--boot-accent-soft);
        font-size: 12px;
      }

      .boot-shell-spin {
        width: 14px;
        height: 14px;
        border: 2px solid var(--boot-line);
        border-top-color: var(--boot-accent);
        border-radius: 999px;
        animation: boot-spin 0.82s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="Aieyra Workspace 启动中">
        <section class="boot-shell-card">
          <div class="boot-shell-mark" aria-hidden="true">II</div>
          <h1>Aieyra Workspace 正在启动</h1>
          <p>正在加载工作台界面与本地会话。</p>
          <div class="boot-shell-line">
            <span class="boot-shell-spin" aria-hidden="true"></span>
            准备桌面环境
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
