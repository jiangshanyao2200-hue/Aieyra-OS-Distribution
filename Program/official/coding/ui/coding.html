<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: aieyra-theme:; font-src 'self' data: aieyra-theme:; media-src blob:; worker-src 'self' blob:; connect-src 'self'">
<title>Coding</title>
<link rel="stylesheet" href="../../../../Client/Desktop/ui/fonts.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/app-shell.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/workspace.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/surface.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/appearance.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/desktop-shell.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/forms.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/system.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/look.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/ui-system.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/window-theme.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/conversation.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/conversation-shared.css">
<link rel="stylesheet" href="../../../../Tool/presentation/receipt-reader.css">
<link rel="stylesheet" href="../../../../Client/Desktop/ui/image-gallery.css"><link rel="stylesheet" href="../../../../Theme/official/default/media.css"><link rel="stylesheet" href="../../../../Client/Desktop/ui/work-surface.css"><link rel="stylesheet" href="../../../../Client/Desktop/ui/layered-chat.css"><link rel="stylesheet" href="../../../../Client/Desktop/assets/monaco/vs/editor/editor.main.css"><link rel="stylesheet" href="coding.css"></head>
<body class="conversation-agent coding-page composer-open" data-form="chat" data-placement="attached">
<main class="cd-main">
 <section class="cd-terminal" aria-label="Cota 与 Vaya 的工作记录"><div id="t-stream" class="cd-stream"></div></section>
 <header id="coding-toolbar" class="coding-toolbar"><strong>Coding</strong><span id="project-path"></span><button id="project-new" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建</button><button id="project-choose" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5h6l2 3h10v3M3 9h18l-3 10H4z"/></svg>打开项目</button><button id="project-open" type="button" aria-controls="project-dialog" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h11l4 4v14H4zM14 3v5h5M7 12h9M7 16h7"/></svg>项目文件</button></header>
 <section class="cd-side" aria-label="Coding 对话">
  <div id="chat-scroll" class="cd-chat" tabindex="0" aria-label="对话记录"><div id="welcome" class="shared-chat-messages"></div><div id="chat" class="shared-chat-messages"></div></div>
  <p id="chat-status" class="cd-status" role="status" hidden></p>
  <footer id="bottom-bar" class="bottom-bar"><div id="input-dock"><section id="composer" class="composer" role="group" aria-label="给 Coding 写消息"></section></div></footer>
 </section>
 <nav id="status-rail" aria-label="计划与报告">
      <div id="plan-orb" class="rail-orb" data-pill="open" hidden>
        <button id="plan-bubble" class="plan-ball" type="button" aria-label="当前计划" aria-expanded="false" aria-controls="plan-pop">
          <svg class="plan-ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="plan-track" cx="22" cy="22" r="20"/><circle class="plan-arc" cx="22" cy="22" r="20" pathLength="100"/></svg>
          <svg class="plan-glyph" viewBox="0 0 24 24" aria-hidden="true"><path class="l1" d="M8 8h9"/><path class="l2" d="M8 12h6"/><path class="l3" d="M8 16h8"/><circle cx="5.2" cy="8" r=".9"/><circle cx="5.2" cy="12" r=".9"/><circle cx="5.2" cy="16" r=".9"/></svg>
          <span class="plan-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </button>
        <div class="plan-pill"><span class="plan-track-text" id="plan-current"></span><small id="plan-count"></small></div>
      </div>
 </nav>
 <section id="plan-pop" aria-label="完整计划" hidden><div id="plan-pop-content"></div></section>
</main>
<dialog id="project-dialog" class="ui-dialog coding-project-dialog" aria-label="项目文件">
 <header><strong>项目文件</strong><button id="project-close" class="quiet" type="button">关闭</button></header>
 <div class="cd-work"><section class="cd-project project-empty" aria-label="Cota 与 Vaya 共用项目视野"></section></div>
</dialog>
<dialog id="work-detail" class="ui-dialog" aria-label="工作详情"><header><strong id="detail-title"></strong><button id="detail-close" class="quiet" type="button">关闭</button></header><div id="detail-body"></div></dialog>
<div id="app-notice" class="cd-notice" role="status" hidden></div>
<script src="../../../../Client/Desktop/assets/monaco/vs/loader.js"></script>
<script type="module" src="coding.mjs"></script>
</body></html>
