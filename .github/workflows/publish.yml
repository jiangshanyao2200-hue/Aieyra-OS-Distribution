name: Publish official builds
on:
  push:
    branches: [release-queue]
    paths: [channels.json, publish.py, .github/workflows/publish.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
concurrency:
  group: official-distribution
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read trusted publisher and selected channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/release-queue" --jq .sha)
          for file in publish.py channels.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$file?ref=$revision" > "$file"
          done
          python3 publish.py
